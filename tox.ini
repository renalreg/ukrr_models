[tox]
isolated_build = true
envlist = py{312, 313}, ruff_format, ruff_lint, mypy, bandit, 

[gh-actions]
python =
    3.12: py312, ruff_format, ruff_lint, mypy, bandit
    3.13: py313

[testenv]
allowlist_externals = poetry
skip_install = true
commands =
    poetry install -v
    poetry run pytest

[testenv:ruff_format]
description = 'Check code style with Ruff'
skip_install = true
commands = poetry run ruff format . --check

[testenv:ruff_lint]
description = 'Execute static analysis with ruff.'
skip_install = true
commands = poetry run ruff check .

[testenv:mypy]
description = 'Execute static analysis with mypy.'
skip_install = true
commands = poetry run mypy ukrr_models/

[testenv:bandit]
description = 'Execute static analysis with bandit.'
commands = poetry run  bandit -c pyproject.toml -r ukrr_models/
